<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OLYMPUS 2.0 ⚡ 2D Cyber-Olympian Arena Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #161f36 0%, #0b0f1a 100%);
      color: #edebe6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 2.0rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #3df5ff 0%, #edebe6 45%, #ffc94a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(61, 245, 255, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffc94a;
      background: rgba(255, 201, 74, 0.12);
      border: 1px solid rgba(255, 201, 74, 0.35);
      padding: 3px 14px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #0b0f1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(61, 245, 255, 0.25);
      border: 2px solid #3df5ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
    }
    #loading {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0b0f1a;
      inset: 0;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(61, 245, 255, 0.2);
      border-top-color: #3df5ff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: #edebe6;
    }
    .control-pill {
      background: rgba(237, 235, 230, 0.06);
      border: 1px solid rgba(61, 245, 255, 0.25);
      padding: 6px 14px;
      border-radius: 8px;
    }
    .key {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #3df5ff;
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: 700;
      color: #3df5ff;
      font-size: 0.8rem;
    }
    footer {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #718096;
      text-align: center;
    }
  </style>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <header>
    <h1>⚡ OLYMPUS 2.0</h1>
    <div class="badge">Server-Citadel Infiltration • Rogue Drone Root Protocol</div>
  </header>

  <div id="game-container">
    <div id="loading">
      <div class="spinner"></div>
      <p style="color: #3df5ff; font-weight: 700; letter-spacing: 0.5px;">Breaching Citadel Firewall & Booting Drone...</p>
    </div>
  </div>

  <div id="controls">
    <div class="control-pill"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move Drone</div>
    <div class="control-pill"><span class="key">MOUSE</span> Aim</div>
    <div class="control-pill"><span class="key">LEFT CLICK</span> Shoot Cyan Bolts</div>
    <div class="control-pill" style="color: #ff3d7f;">⚠️ Survive 60s & Purge ZEUS.EXE</div>
  </div>

  <footer>
    Built with Go & Ebitengine v2 for Cloud Day Athens 2026 • Deployed on Google Cloud Run
  </footer>

  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
      document.getElementById("loading").style.opacity = "0";
      setTimeout(() => {
        const loadingEl = document.getElementById("loading");
        if (loadingEl) loadingEl.remove();
      }, 300);
      go.run(result.instance);
    }).catch((err) => {
      console.error("WASM load failed:", err);
      const loadingEl = document.getElementById("loading");
      if (loadingEl) {
        loadingEl.innerHTML = `<p style="color:#ff3d7f;font-weight:bold;">Breach Failed: ${err}</p>`;
      }
    });
  </script>
</body>
</html>
